version: "3.8"

services:
  ikuai-backup:
    build: .
    container_name: ikuai-backup
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
      - ./backups:/backups
    environment:
      - IKUAI_BACKUP_HOST=0.0.0.0
      - IKUAI_BACKUP_PORT=5000
      - IKUAI_BACKUP_DATA_DIR=/data
      - IKUAI_BACKUP_DIR=/backups
      - IKUAI_BACKUP_USE_WAITRESS=true
      - IKUAI_NOTIFY_WEBHOOK=
      - IKUAI_API_TOKEN=ikuai-backup-token
    restart: unless-stopped
